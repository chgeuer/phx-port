name: Native build and integration tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            go_arch: amd64
            node_arch: x64
            machine: x86_64
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            go_arch: arm64
            node_arch: arm64
            machine: aarch64
          - name: macOS x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            go_arch: amd64
            node_arch: x64
            machine: x86_64
          - name: macOS ARM64
            os: macos-15
            target: aarch64-apple-darwin
            go_arch: arm64
            node_arch: arm64
            machine: arm64
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: "1.23.x"
        cache: false
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: samples/python/pyproject.toml
    - uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: npm
        cache-dependency-path: samples/node/package-lock.json
    - name: Verify native target
      shell: bash
      run: |
        set -euo pipefail
        test "$(rustc -vV | sed -n 's/^host: //p')" = "${{ matrix.target }}"
        test "$(go env GOHOSTARCH)" = "${{ matrix.go_arch }}"
        test "$(node -p process.arch)" = "${{ matrix.node_arch }}"
        test "$(python -c 'import platform; print(platform.machine())')" = "${{ matrix.machine }}"
    - name: Build
      run: cargo build --locked --verbose --target ${{ matrix.target }}
    - name: Run tests
      run: cargo test --locked --verbose --target ${{ matrix.target }}
    - name: Test Rust handoff sample
      run: cargo test --locked --manifest-path samples/rust/Cargo.toml --verbose --target ${{ matrix.target }}
    - name: Test Rustler handoff broker
      run: cargo test --locked --manifest-path phx_port_handoff/native/phx_port_handoff_native/Cargo.toml --verbose --target ${{ matrix.target }}
    - name: Test Go net/http handoff adapter
      working-directory: samples/go
      run: go vet ./... && go test -race ./...
    - name: Install Python FastAPI handoff adapter
      working-directory: samples/python
      run: python -m pip install -e ".[test]"
    - name: Test Python FastAPI handoff adapter
      working-directory: samples/python
      run: |
        ruff format --check .
        ruff check .
        python -m compileall -q src tests
        pytest -q
    - name: Test Node Fastify handoff adapter
      working-directory: samples/node
      run: |
        npm ci --no-audit --no-fund
        npm test
    - name: Validate launchd plists
      if: runner.os == 'macOS'
      run: plutil -lint packaging/launchd/*.plist
