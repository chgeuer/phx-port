[package]
name = "phx-port"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Central port registry for Phoenix projects"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
atomicwrites = "0.4"
ctrlc = "3"
fs2 = "0.4"
getrandom = "0.3"
native-tls = "0.2"
nix = { version = "0.30", features = ["fs", "resource", "socket", "uio", "user"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.6"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
toml_edit = "0.22"
x509-parser = "0.18"

[dev-dependencies]
rcgen = "0.14"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14.11"
