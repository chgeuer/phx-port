[package]
name = "phx-port"
version = "0.1.0"
edition = "2024"
description = "Central port registry for Phoenix projects"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
atomicwrites = "0.4"
fs2 = "0.4"
native-tls = "0.2"
sha2 = "0.10"
socket2 = "0.6"
toml_edit = "0.22"
x509-parser = "0.18"

[dev-dependencies]
rcgen = "0.14"
tempfile = "3"
